name: Build SY108 OpenWrt Firmware

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main ]  # 推送到 main 分支时触发（可按需修改）
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 根据编译时长调整

    steps:
      - name: Checkout sy108-mainline
        uses: actions/checkout@v4

      # 设置 QEMU，以便在 x86_64 runner 上运行 linux/arm64 容器
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Verify Python version
        run: |
          python3 --version
          # README 要求 Python 3.12+，如果系统版本不够，考虑安装
          # 目前 ubuntu-latest 通常已满足

      - name: Run bootstrap
        run: |
          export SY108_PYTHON=$(which python3)
          python3 tools/bootstrap.py

      - name: Build main firmware
        run: |
          export SY108_PYTHON=$(which python3)
          python3 tools/build/firmware.py main

      - name: Build recovery firmware
        run: |
          export SY108_PYTHON=$(which python3)
          python3 tools/build/firmware.py recovery

      - name: List output files
        run: |
          echo "=== Main images ==="
          ls -la out/images/main/ || true
          echo "=== Recovery images ==="
          ls -la out/images/recovery/ || true

      - name: Upload main firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sy108-openwrt-main
          path: |
            out/images/main/sysupgrade.bin
            out/images/main/*
          if-no-files-found: warn

      - name: Upload recovery firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sy108-openwrt-recovery
          path: |
            out/images/recovery/boot.bin
            out/images/recovery/*
          if-no-files-found: warn