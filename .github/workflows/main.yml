name: Build SY108 / UDX710 Firmware

on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: 强制全量重建（清空构建树）
        required: false
        type: boolean
        default: false
      ccache_enable:
        description: 启用CCache缓存
        required: false
        type: boolean
        default: true

env:
  TZ: Asia/Shanghai
  WORK_ROOT: ${{ github.workspace }}
  REPO_MAIN: ${{ github.workspace }}
  OUT_DIR: ${{ github.workspace }}/out
  UBOOT_SPL_REPO: https://github.com/yonyony1/sy108-uboot-spl.git
  UBOOT_SPL_PATH: ${{ github.workspace }}/uboot-spl
  ORIG_SPL: ${{ github.workspace }}/assets/original-spl.bin
  ORIG_SML: ${{ github.workspace }}/assets/original-sml.bin

jobs:
  build-firmware:
    name: Build Main + Recovery Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout sy108-mainline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison git libssl-dev libelf-dev \
            ncurses-dev python3 python3-pip python3-venv \
            unzip wget rsync file ccache swig \
            qemu-user jq
          python3 -m pip install --upgrade pip

      - name: Prepare Python environment
        run: |
          python3 -m pip install -r requirements.txt || true

      - name: Setup CCache
        if: inputs.ccache_enable
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: sy108-ccache-${{ github.sha }}
          restore-keys: |
            sy108-ccache-
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_MAXSIZE: 12G
          CCACHE_COMPRESS: true

      - name: Clean full build tree (if requested)
        if: inputs.rebuild_all
        run: |
          rm -rf ${{ env.OUT_DIR }}

      - name: Prepare kernel working dir
        run: |
          mkdir -p ${{ env.OUT_DIR }}/linux
          KERNEL_REPO=$(jq -r '.repo' manifests/kernel.json)
          if [ ! -d "${{ env.OUT_DIR }}/linux/.git" ]; then
            git clone --depth=1 "$KERNEL_REPO" ${{ env.OUT_DIR }}/linux
          fi
        working-directory: ${{ env.REPO_MAIN }}

      - name: Auto Refresh Kernel Hash (Fix Checksum Mismatch)
        run: |
          python3 tools/build/kernel-source.py
        working-directory: ${{ env.REPO_MAIN }}

      - name: Bootstrap OpenWrt build tree
        run: |
          python3 tools/bootstrap.py
        working-directory: ${{ env.REPO_MAIN }}

      - name: Build MAIN firmware
        run: |
          python3 firmware.py main
        working-directory: ${{ env.REPO_MAIN }}

      - name: Build RECOVERY firmware
        run: |
          python3 firmware.py recovery
        working-directory: ${{ env.REPO_MAIN }}

      - name: Upload MAIN firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sy108-main-firmware
          path: ${{ env.OUT_DIR }}/images/main/
          if-no-files-found: error
          retention-days: 14

      - name: Upload RECOVERY firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sy108-recovery-firmware
          path: ${{ env.OUT_DIR }}/images/recovery/
          if-no-files-found: error
          retention-days: 14

  build-uboot-spl:
    name: Build & Verify U-Boot SPL
    needs: build-firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download MAIN firmware
        uses: actions/download-artifact@v4
        with:
          name: sy108-main-firmware
          path: ${{ env.OUT_DIR }}/images/main

      - name: Download RECOVERY firmware
        uses: actions/download-artifact@v4
        with:
          name: sy108-recovery-firmware
          path: ${{ env.OUT_DIR }}/images/recovery

      - name: Clone sy108-uboot-spl
        run: |
          rm -rf ${{ env.UBOOT_SPL_PATH }}
          git clone --depth 1 ${{ env.UBOOT_SPL_REPO }} ${{ env.UBOOT_SPL_PATH }}

      - name: Check original SPL/SML binaries
        run: |
          if [ ! -f "${{ env.ORIG_SPL }}" ] || [ ! -f "${{ env.ORIG_SML }}" ]; then
            echo "ERROR: Missing original-spl.bin / original-sml.bin in assets/"
            exit 1
          fi
          ls -la ${{ env.ORIG_SPL }} ${{ env.ORIG_SML }}
          ls -la ${{ env.OUT_DIR }}/images/main/boot.bin ${{ env.OUT_DIR }}/images/recovery/boot.bin

      - name: Build U-Boot offline + QEMU/Unicorn verify
        run: |
          cd ${{ env.UBOOT_SPL_PATH }}
          make offline LABEL=mainline \
            SPL_IMAGE=${{ env.ORIG_SPL }} \
            SML_IMAGE=${{ env.ORIG_SML }} \
            MAIN_CAPSULE=${{ env.OUT_DIR }}/images/main/boot.bin \
            RECOVERY_CAPSULE=${{ env.OUT_DIR }}/images/recovery/boot.bin

      - name: Upload U-Boot artifact
        uses: actions/upload-artifact@v4
        with:
          name: sy108-uboot-spl
          path: |
            ${{ env.UBOOT_SPL_PATH }}/build/mainline/uboot.bin
            ${{ env.UBOOT_SPL_PATH }}/offline-report.json
          if-no-files-found: error
          retention-days: 14
